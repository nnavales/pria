# Pria theme for Herdr.
#
# Herdr cannot import a separate theme file. Merge this block into
# ~/.config/herdr/config.toml, then run:
#
#   herdr server reload-config

[theme]
name = "terminal"
auto_switch = false

[theme.custom]
overlay0       = "#8A9698"
subtext0       = "#8a9698"
text           = "#D3D9DA"
accent         = "#A8BEC2"

sidebar_bg     = "#212527"
active_row_bg  = "#2A2F32"
selection_bg   = "#394B5B"

panel_bg       = "#1C1F21"
surface0       = "#1C1F21"
overlay1       = "#8A9698"

surface1       = "#394B5B"
surface_dim    = "#2A2F32"

green          = "#ACEAFE"
yellow         = "#34DACA"
teal           = "#89E28E"
red            = "#F7ABD1"
mauve          = "#a8bec2"
blue           = "#79BCF6"
peach          = "#E3B341"

